[build]
  publish = "."

# Pretty URLs: /about serves about.html
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Glove box holders discontinued 26/10/2026 (Elbe)
[[redirects]]
  from = "/hospital/glove-box-holders"
  to = "/hospital/"
  status = 301

# Keep the page generator source private
[[redirects]]
  from = "/_src/*"
  to = "/404"
  status = 404
  force = true

