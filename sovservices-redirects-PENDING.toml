# Sov Services domain redirects. NOT ACTIVE.
# Activate 1 to 2 weeks after the site settles (Bruce, 24/10/2026):
#   1. Netlify > Domain management > add sovservices.net.au and www.sovservices.net.au as domain aliases.
#   2. Point sovservices.net.au DNS at Netlify (move DNS to Cloudflare first, like brisplastics.com.au).
#      Copy the MX and TXT records exactly. support@sovservices.net.au mail must keep working.
#   3. Paste the blocks below into netlify.toml ABOVE the existing redirects, swap TARGET for the
#      live primary domain (brisplastics.com.au or plasticsunique.com.au), commit and deploy.
#   4. Test every old URL returns 301 to the right page, then add sovservices.net.au to Search Console
#      and use the Change of Address tool.

[[redirects]]
  from = "https://sovservices.net.au/products"
  to = "https://TARGET/hospital/"
  status = 301
  force = true

[[redirects]]
  from = "https://sovservices.net.au/contact"
  to = "https://TARGET/hospital/order"
  status = 301
  force = true

[[redirects]]
  from = "https://sovservices.net.au/m/*"
  to = "https://TARGET/hospital/order"
  status = 301
  force = true

[[redirects]]
  from = "https://sovservices.net.au/*"
  to = "https://TARGET/hospital/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sovservices.net.au/products"
  to = "https://TARGET/hospital/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sovservices.net.au/contact"
  to = "https://TARGET/hospital/order"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sovservices.net.au/*"
  to = "https://TARGET/hospital/"
  status = 301
  force = true
